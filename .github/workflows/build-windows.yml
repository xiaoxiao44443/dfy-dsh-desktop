name: Build Windows x64

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      npm_config_arch: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm package:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: dfy-dsh-desktop-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: release/DFY-DSH-Desktop-*-x64.exe
