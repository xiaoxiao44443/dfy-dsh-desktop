name: Release desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-x64:
    uses: ./.github/workflows/build-windows.yml

  build-macos-intel:
    uses: ./.github/workflows/build-macos-intel.yml

  build-macos-arm64:
    uses: ./.github/workflows/build-macos-arm64.yml

  publish-release:
    name: Publish GitHub release
    needs:
      - build-windows-x64
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download packaged applications
        uses: actions/download-artifact@v8
        with:
          pattern: dfy-dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          notes=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            if [[ -f "$notes_file" ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
            fi
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              "${notes[@]}" \
              --title "DFY DSH Desktop ${GITHUB_REF_NAME#v}" \
              "${prerelease[@]}"
          fi
