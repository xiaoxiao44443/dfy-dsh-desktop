name: Build macOS Apple Silicon

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS 12+ Apple Silicon (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      npm_config_arch: arm64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: arm64
          cache: pnpm

      - name: Verify native ARM64 build environment
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Apple Silicon packaging requires a native macOS ARM64 runner')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.minimum-release-age-exclude='*'

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Apple Silicon DMG and ZIP
        run: pnpm package:mac:arm64

      - name: Verify packaged Harness startup
        run: node scripts/verify-packaged-macos.mjs arm64

      - name: Upload Apple Silicon artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dfy-dsh-desktop-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/DFY-DSH-Desktop-*-macos-arm64.dmg
            release/DFY-DSH-Desktop-*-macos-arm64.zip
